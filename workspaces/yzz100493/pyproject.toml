[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-audit"
version = "1.0.0"
description = "依赖许可证巡查工具 - 扫描项目依赖、匹配白名单、生成研发和法务报告"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "packaging>=21.0",
    "Jinja2>=3.0",
    "click>=8.0",
    "tomli>=2.0;python_version<'3.11'",
]

[project.scripts]
license-audit = "license_audit.cli:main"

[tool.setuptools.packages.find]
include = ["license_audit*"]
