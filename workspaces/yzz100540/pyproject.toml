[project]
name = "renewal-aligner"
version = "1.0.0"
description = "SaaS 客户成功续费对齐 CLI - 多系统数据合并、风险识别与跟进管理"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
    "thefuzz>=0.22.0",
    "python-Levenshtein>=0.23.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "pydantic>=2.0.0",
]

[project.scripts]
renewal-aligner = "renewal_aligner.cli:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renewal_aligner*"]
