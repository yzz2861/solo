[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-drift"
version = "1.0.0"
description = "YAML 配置漂移比对工具 - 多环境配置差异检测与报告"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "DevOps Team" }]
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "deepdiff>=6.7.0",
]

[project.scripts]
yaml-drift = "yaml_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
