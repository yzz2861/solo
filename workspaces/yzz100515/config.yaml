# 截图隐私遮罩配置文件
# ========================================

# 遮罩颜色 (RGB)
mask_color: [0, 0, 0]

# 遮罩内边距（像素）
mask_padding: 6

# 深色主题判定阈值 (0-255, 越低越暗)
dark_theme_threshold: 85

# 疑似文本最低置信度 (0-1)
min_text_confidence: 0.55

# 是否对疑似区域也应用遮罩
mask_suspect_regions: true

# ========================================
# 正则表达式规则
# 用于识别文本中的敏感信息模式
# ========================================
regex_rules:
  # 手机号 - 中国大陆
  - name: "手机号"
    pattern: "1[3-9]\\d{9}"
    priority: 1.0
    needs_review: false

  # 身份证号
  - name: "身份证号"
    pattern: "\\d{17}[\\dXx]"
    priority: 1.0
    needs_review: false

  # 邮箱地址
  - name: "邮箱地址"
    pattern: "[\\w.-]+@[\\w.-]+\\.\\w+"
    priority: 0.8
    needs_review: false

  # 订单号
  - name: "订单号"
    pattern: "(?:订单号?|order[_\\s]?id)[:：\\s]*[A-Za-z0-9_-]{8,}"
    priority: 0.9
    needs_review: true

  # 姓名（带标签）
  - name: "姓名(带标签)"
    pattern: "(?:姓名|name|用户名|user\\s?name)[:：\\s]*[\\u4e00-\\u9fa5]{2,4}"
    priority: 0.7
    needs_review: true

  # 银行卡号
  - name: "银行卡号"
    pattern: "\\b\\d{16,19}\\b"
    priority: 0.85
    needs_review: true

  # 金额
  - name: "金额"
    pattern: "(?:金额|实付|应付|总价|total)[:：\\s]*[￥¥$]?\\d+\\.?\\d*"
    priority: 0.6
    needs_review: true

# ========================================
# 区域遮罩规则
# 按位置直接遮挡固定区域
# ========================================
area_rules:
  # 顶部导航栏 - 相对坐标 (0-1)
  - name: "顶部用户信息栏"
    type: "relative"
    x: 0.0
    y: 0.0
    width: 1.0
    height: 0.07
    needs_review: true

  # 左侧边栏用户信息
  - name: "左侧用户信息区"
    type: "relative"
    x: 0.0
    y: 0.0
    width: 0.18
    height: 0.2
    needs_review: true

  # 底部状态栏
  - name: "底部状态栏"
    type: "relative"
    x: 0.0
    y: 0.93
    width: 1.0
    height: 0.07
    needs_review: true

  # 右上角头像/用户信息区
  - name: "右上角用户区"
    type: "relative"
    x: 0.85
    y: 0.0
    width: 0.15
    height: 0.08
    needs_review: false

  # 右上角内部操作按钮区
  - name: "内部操作按钮区"
    type: "relative"
    x: 0.75
    y: 0.08
    width: 0.25
    height: 0.08
    needs_review: true
