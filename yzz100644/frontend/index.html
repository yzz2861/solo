<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品说明书问答校验系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📘 产品说明书问答校验系统</h1>
        <p>导入说明书与FAQ · 客服问答校验 · 主管统计导出</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('agent', this)">💬 客服问答</div>
        <div class="tab" onclick="switchTab('supervisor', this)">📊 主管统计</div>
        <div class="tab" onclick="importSampleData()">📥 导入示例数据</div>
    </div>

    <div id="tab-agent" class="tab-content">
        <div class="card">
            <div class="card-title">提问查询</div>
            <div class="form-row">
                <div class="form-group">
                    <label>客服工号</label>
                    <input id="agentId" type="text" placeholder="如：agent001" value="agent001" />
                </div>
                <div class="form-group">
                    <label>产品型号 <span class="text-muted">（建议必选，否则会提示补问）</span></label>
                    <select id="productModel">
                        <option value="">全部型号 / 未指定</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>用户问题</label>
                <textarea id="question" rows="3" placeholder="输入用户的问题，如：XX型号怎么安装？保修期多久？..."></textarea>
            </div>
            <button id="submitBtn" class="btn btn-primary">查询答案</button>
        </div>

        <div id="answerBox" class="answer-box hidden"></div>
    </div>

    <div id="tab-supervisor" class="tab-content hidden">
        <div class="card">
            <div class="card-title">📈 总体统计</div>
            <div id="statsGrid" class="stats-grid"></div>
        </div>

        <div class="card">
            <div class="card-title">
                🔥 高频无答案问题（建议反馈产品补充文档）
                <span style="float:right;">
                    <a class="btn btn-sm btn-primary" href="/api/supervisor/export/no-answer.csv">导出CSV</a>
                </span>
            </div>
            <table id="noAnswerTable">
                <thead><tr><th>问题</th><th>频次</th><th>型号类型</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-title">
                🕐 旧型号专属问题（单独分类）
                <span style="float:right;">
                    <a class="btn btn-sm btn-primary" href="/api/supervisor/export/old-model.csv">导出CSV</a>
                </span>
            </div>
            <table id="oldModelTable">
                <thead><tr><th>问题</th><th>频次</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-title">📝 客服采纳 / 改判记录</div>
            <table id="decisionsTable">
                <thead><tr><th>问题</th><th>客服</th><th>结果</th><th>改判原因</th><th>主管审核</th><th>时间</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
